<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="inde.css">
    <title>To Do List</title>
</head>
<body>
    <h1 class="title">TO-DO LIST</h1>
    <div class="note-header">
        <input type="text" class="input-button" placeholder="What to do today?">
        <button class="button">➕Add</button>
        
    <!-- Added a class to line break, so i can manipulate it in CSS-->
        <hr class="line">

    </div>
    <div>
        <label>
            <input type="checkbox" class="checkbox">
            Wake Up
              <hr class="line">
            <input type="checkbox" class="checkbox">
            Get Ready
              <hr class="line">
            <input type="checkbox" class="checkbox">
            Eat breakfast
              <hr class="line">
            <input type="checkbox" class="checkbox">
            Go to gym
              <hr class="line">
            <input type="checkbox" class="checkbox">
            Code all day
        </label>
    </div>

</body>
</html>
